[package]
name = "bgremove-ort"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Verified CPU ONNX Runtime inference and bounded session pools"

[dependencies]
bgremove-core = { path = "../bgremove-core" }
bgremove-models = { path = "../bgremove-models" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ort = { version = "2.0.0-rc.11", default-features = false, features = ["std", "load-dynamic"] }
image.workspace = true

[features]
default = []
# BRIA's checkpoint licence is restrictive.  Consumers shipping a commercial
# binary can build with --no-default-features to remove the BRIA ONNX adapter;
# the deterministic tensor helpers remain available for parity tests.
bria = []
coreml = ["ort/coreml"]
cuda = ["ort/cuda"]
